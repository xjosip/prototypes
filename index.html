<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototypes</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #333; }
  h1 { font-size: 24px; margin-bottom: 32px; }
  a { color: #084AFF; text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul { list-style: none; padding: 0; }
  li { padding: 8px 0; border-bottom: 1px solid #eee; }

  .gate { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 999; }
  .gate form { text-align: center; }
  .gate input[type="password"] {
    font-size: 16px; padding: 10px 16px; border: 2px solid #ddd; border-radius: 6px;
    outline: none; width: 240px; display: block; margin: 0 auto 12px;
  }
  .gate input[type="password"]:focus { border-color: #084AFF; }
  .gate button {
    font-size: 14px; font-weight: 600; padding: 10px 24px; background: #084AFF; color: #fff;
    border: none; border-radius: 6px; cursor: pointer;
  }
  .gate button:hover { background: #0640d6; }
  .gate .error { color: #e00; font-size: 13px; margin-top: 8px; display: none; }
  .gate label { font-size: 14px; color: #666; margin-bottom: 8px; display: block; }
  .content { display: none; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="auth">
    <h1>Prototypes</h1>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="off" autofocus>
    <button type="submit">Enter</button>
    <div class="error" id="err">Wrong password</div>
  </form>
</div>

<div class="content" id="content">
  <h1>Prototypes</h1>
  <ul>
    <li><a href="voith-nav/">voith-nav</a></li>
  </ul>
</div>

<script>
const HASH = '8573556848636e0f0ce0ef26aa645c1d2c935e63c59970f8006912c9927e52cc';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function unlock() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

if (sessionStorage.getItem('proto_auth') === HASH) unlock();

document.getElementById('auth').addEventListener('submit', async e => {
  e.preventDefault();
  const h = await sha256(document.getElementById('pw').value);
  if (h === HASH) {
    sessionStorage.setItem('proto_auth', HASH);
    unlock();
  } else {
    document.getElementById('err').style.display = 'block';
  }
});
</script>
</body>
</html>
